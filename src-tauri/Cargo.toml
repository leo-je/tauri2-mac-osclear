[package]
name = "macos-cleaner"
version = "1.0.0"
description = "macOS System Cleaner Tool"
authors = ["shengte"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "macos_cleaner_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
strip = true
