name: Build and Release macOS

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
      created: ${{ steps.create_tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create unique tag
        id: create_tag
        run: |
          git fetch --tags
          
          BASE_VERSION="v0.0"
          RUN_NUMBER="${{ github.run_number }}"
          TAG="${BASE_VERSION}.${RUN_NUMBER}"
          
          while git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; do
            RUN_NUMBER=$((RUN_NUMBER + 1))
            TAG="${BASE_VERSION}.${RUN_NUMBER}"
          done
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "created=true" >> $GITHUB_OUTPUT
          
          git tag -a $TAG -m "Release $TAG"
          git push origin $TAG

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          release_name: Release ${{ steps.create_tag.outputs.tag }}
          draft: false
          prerelease: false

  build-macos:
    needs: create-tag
    if: needs.create-tag.outputs.created == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - universal-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-tag.outputs.tag }}
          releaseName: Release ${{ needs.create-tag.outputs.tag }}
          releaseBody: Automated release for ${{ needs.create-tag.outputs.tag }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }}
