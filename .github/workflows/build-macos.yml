name: Build and Release macOS

on:
  push:
    branches:
      - dev

jobs:
  create-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Create tag
        id: create_tag
        run: |
          TAG="v0.0.${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-tag
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - universal-apple-darwin
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Install dependencies
        run: |
          npm install
          
      - name: Build frontend
        run: |
          npm run build
          
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: ${{ needs.create-tag.outputs.tag }}
          releaseName: 'Release ${{ needs.create-tag.outputs.tag }}'
          releaseBody: 'Automated release for ${{ needs.create-tag.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }}
          
      - name: Rename artifacts
        id: rename
        run: |
          VERSION="${{ needs.create-tag.outputs.tag }}"
          ARCH="${{ matrix.target }}"
          
          if [[ "$ARCH" == "universal-apple-darwin" ]]; then
            PLATFORM="universal"
          elif [[ "$ARCH" == "x86_64-apple-darwin" ]]; then
            PLATFORM="x86"
          elif [[ "$ARCH" == "aarch64-apple-darwin" ]]; then
            PLATFORM="arm"
          fi
          
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              NEW_NAME="Mac-cleaner-${PLATFORM}-${VERSION}.dmg"
              mv "$dmg" "../../../$NEW_NAME"
              echo "dmg=$NEW_NAME" >> $GITHUB_OUTPUT
            fi
          done
          
          for app in *.app; do
            if [ -d "$app" ]; then
              NEW_NAME="Mac-cleaner-${PLATFORM}-${VERSION}.app"
              cp -r "$app" "../../../$NEW_NAME"
              echo "app=$NEW_NAME" >> $GITHUB_OUTPUT
            fi
          done
          
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          files: |
            src-tauri/target/Mac-cleaner-*.dmg
            src-tauri/target/Mac-cleaner-*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
